# 最小 CI:保证 HEAD「格式对、能编译、vet 过」,并跑除 internal/app 外各包的单元测试(约 7 秒)。
# internal/app 的界面测试多且重,仍按项目工作流在阶段三集中跑(连同 computer use 实测);
# 真实 claude 的测试需 MINI_REAL_CLAUDE=1,这里自动跳过。不做打包 / 发布(走 scripts/package.sh、publish.sh)。
name: CI

on:
  push:
    branches: [main, feat/mygo]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # MyGo 是 macOS 原生界面,依赖系统框架,只能在 macOS 上编译
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mygo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mygo/go.mod
          cache-dependency-path: mygo/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化(请在本地运行 gofmt -w):"
            echo "$out"
            exit 1
          fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test(除 internal/app)
        run: go test -count=1 $(go list ./... | grep -v -E '/internal/app$|/cmd/')
