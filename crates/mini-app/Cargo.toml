[package]
name = "mini-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "minicode"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
mini-core = { path = "../mini-core" }
mini-diag = { path = "../mini-diag" }
mini-term = { path = "../mini-term" }
mini-demo = { path = "../mini-demo" }
mini-config = { path = "../mini-config" }
mini-canvas = { path = "../mini-canvas" }
mini-automation = { path = "../mini-automation" }
mini-browser = { path = "../mini-browser" }
mini-claude = { path = "../mini-claude" }
mini-lsp = { path = "../mini-lsp" }
mini-sheet = { path = "../mini-sheet" }
mini-search = { path = "../mini-search" }
mini-mermaid = { path = "../mini-mermaid" }
lsp-types = "0.97"
tree-sitter-swift = "0.7.4"
gpui-base = "0.8.0"
ropey = "2.0.0-beta.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cmake = "0.7.6"
tree-sitter-proto = "0.2.0"
anyhow = "1"
serde_json.workspace = true
gpui-kit-markdown-editor = { version = "0.1.1", default-features = false }
async-channel = "2"
notify = "8"
similar = "2"
uuid = { version = "1", features = ["v4"] }

# Dock 图标随主题切换、菜单栏托盘(与 gpui 用同一版本的 objc2,不新增依赖树)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSGeometry", "NSString", "NSError"] }
# 系统通知:走 UserNotifications(通知归属本应用、图标取应用包的图标;osascript 会记在「脚本编辑器」名下)
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSImageView", "NSRunningApplication"] }
